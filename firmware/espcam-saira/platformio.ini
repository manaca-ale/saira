[env]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
extra_scripts = pre:tools/load_dotenv.py
; Required for OTA (two app slots). Default for some boards may be huge_app (no OTA).
board_build.partitions = default.csv

[env:ai-thinker-esp32-cam]
; Garante que apenas um "main" seja compilado por environment.
src_filter = +<main.cpp>

[env:ipcam-relay]
; Alternativa: ESP32 faz relay de /snap.jpg de uma camera IP para /upload no servidor.
src_filter = +<ipcam_relay.cpp>

[env:ipcam-relay-esp32s3-devkitc-1-n16r8]
; ESP32-S3 DevKitC-1 N16R8 (16MB Flash, 8MB PSRAM, USB-C).
board = esp32-s3-devkitc-1
src_filter = +<ipcam_relay.cpp>
upload_port = COM20
monitor_port = COM20
board_build.arduino.memory_type = qio_opi
build_flags =
  -DBOARD_HAS_PSRAM

services:
  esp32-receiver:
    build: .
    ports:
      # Production uses 5004 (test uses 5002; services/api-gateway prod uses 5000).
      - "5004:5000"
    env_file:
      - .env
    environment:
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - OTA_DIR=${OTA_DIR:-/app/ota}
      - CONFIG_DIR=${CONFIG_DIR:-/app/config}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-90}
      - GUNICORN_KEEPALIVE=${GUNICORN_KEEPALIVE:-15}
      - GUNICORN_LOG_LEVEL=${GUNICORN_LOG_LEVEL:-info}
      - UPLOAD_LOG_EVERY=${UPLOAD_LOG_EVERY:-20}
    volumes:
      - ./uploads:/app/uploads
      - ./ota:/app/ota
      - ./config:/app/config
    networks:
      default:
      saira_prod_net:
        aliases:
          - esp32-server
    restart: unless-stopped

  fake-worker:
    build:
      context: ../services/yolo-worker-vm
      dockerfile: Dockerfile
    environment:
      - UPLOAD_DIR=/app/uploads
      - STATE_DIR=/app/state
      - DATABASE_URL=postgresql://postgres:postgres@saira-db-prod:5432/saira_db
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5004}
      - POLL_INTERVAL=10
      - MOCK_MODE=true
      - PROCESSED_STRATEGY=marker
      - WORKER_ENABLED=true
    volumes:
      - ./uploads:/app/uploads
      - worker_state:/app/state
    networks:
      - default
      - saira_prod_net
    depends_on:
      - esp32-receiver
    restart: unless-stopped

volumes:
  worker_state:

networks:
  saira_prod_net:
    external: true
    name: saira-prod_default

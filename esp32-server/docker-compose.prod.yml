services:
  esp32-receiver:
    build: .
    ports:
      # Production uses 5001 to avoid colliding with services/api-gateway on 5000.
      - "5001:5000"
    env_file:
      - .env
    environment:
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - OTA_DIR=${OTA_DIR:-/app/ota}
      - CONFIG_DIR=${CONFIG_DIR:-/app/config}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    volumes:
      - ./uploads:/app/uploads
      - ./ota:/app/ota
      - ./config:/app/config
    restart: unless-stopped

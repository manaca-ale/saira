services:
  esp32-receiver:
    build: .
    ports:
      - "5000:5000"
    environment:
      - UPLOAD_DIR=/app/uploads
      # Optional: used to return absolute URLs in the JSON response.
      # - PUBLIC_BASE_URL=http://YOUR_EC2_PUBLIC_IP:5000
      # OTA support (ESP pulls firmware from /ota/latest.bin)
      - OTA_DIR=/app/ota
      # Remote config storage (per-device)
      - CONFIG_DIR=/app/config
      # Optional: protect /ota/upload
      # - ADMIN_TOKEN=change-me
    volumes:
      - ./uploads:/app/uploads
      - ./ota:/app/ota
      - ./config:/app/config
    restart: unless-stopped

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a3a24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>SAIRA Campo</title>
  <link rel="stylesheet" href="/static/dashboard.css?v=field-v1" />
</head>
<body>
  <header class="topbar">
    <h1 class="topbar-title">SAIRA Campo</h1>
    <button class="sync-pill" id="syncPill" type="button" aria-label="Atualizar agora">
      Sincronizando...
    </button>
  </header>

  <main class="device-list" id="deviceList">
    <p class="empty-state">Carregando dispositivos...</p>
  </main>

  <div class="image-overlay" id="imageOverlay" hidden>
    <div class="overlay-header">
      <button class="overlay-close" id="overlayClose" type="button" aria-label="Fechar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="overlay-info">
        <span class="overlay-device" id="overlayDevice"></span>
        <span class="overlay-time" id="overlayTime"></span>
      </div>
    </div>
    <div class="overlay-body" id="overlayBody">
      <img id="overlayImg" alt="Visao da camera" />
    </div>
  </div>

  <template id="deviceCardTpl">
    <article class="device-card" data-device-id="">
      <div class="card-top">
        <span class="status-led"></span>
        <span class="device-id"></span>
        <span class="device-badge"></span>
        <span class="device-ago"></span>
      </div>
      <div class="card-thumb">
        <img loading="lazy" decoding="async" alt="Ultima captura" />
        <span class="thumb-empty">Sem imagem recente</span>
      </div>
    </article>
  </template>

  <script src="/static/dashboard.js?v=field-v1"></script>
</body>
</html>

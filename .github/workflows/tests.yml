name: Testes

# Roda as suítes pytest de cada serviço.
# - Em PRs (para qualquer branch) e sob demanda (workflow_dispatch).
# - Em pushes de main/develop: chamado pelo deploy.yml (workflow_call) e o
#   deploy só começa se TODAS as suítes passarem.
# Sem rede externa, sem banco e sem chamada paga a modelo: os testes usam
# mocks/fixtures (regra: todo bug corrigido ganha teste de regressão).

on:
  # Sem gatilho de push em branch: o PR já roda e evita run duplicado
  # (cada run gasta ~5 min de Actions no repo privado).
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: yolo-worker
            dir: services/yolo-worker-vm
            python: "3.11"
            # ultralytics/torch ficam de fora: os testes cobrem lógica pura e
            # não carregam o YOLO.
            install: |
              grep -viE '^\s*ultralytics' requirements.txt > /tmp/req.txt
              pip install -r /tmp/req.txt pytest
            env: PYTHONPATH=src
            run: python -m pytest -q tests
          - name: backend
            dir: services/backend
            python: "3.11"
            apt: libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libcairo2 libgdk-pixbuf-2.0-0 fonts-dejavu-core
            install: pip install -r requirements.txt
            # Settings exige estas duas; valores fictícios (os testes não abrem banco).
            env: DATABASE_URL=postgresql+asyncpg://ci:ci@localhost:5432/ci SECRET_KEY=ci-dummy-secret
            run: python -m pytest -q tests
          - name: pi-agent
            dir: services/raspberry-pi/agent
            python: "3.11"
            install: pip install -r requirements.txt pytest
            run: python -m pytest -q tests
          - name: pi-tools
            dir: services/raspberry-pi/tools
            python: "3.11"
            install: pip install requests pytest
            run: python -m pytest -q tests
          - name: esp32-server
            dir: esp32-server
            python: "3.9"
            # 3.9 (igual à imagem do esp32-server) não existe no ubuntu-latest (26.04).
            os: ubuntu-24.04
            install: pip install -r requirements.txt pytest
            run: python -m pytest -q test_command_queue.py test_rotate.py
          - name: camera-sim
            dir: tools/camera_sim
            python: "3.11"
            # Simulador da pi-cam para o teste de ponta a ponta; testes sem rede.
            install: pip install requests pytest
            run: python -m pytest -q tests
          - name: infra
            dir: tests/infra
            python: "3.11"
            # Lê os composes e o deploy.yml: portas internas só em 127.0.0.1,
            # senhas e SECRET_KEY por variável, rotação de log, teste e produção
            # em checkouts separados.
            install: pip install pyyaml pytest
            run: python -m pytest -q .
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: '**/requirements*.txt'

      - name: Pacotes do sistema
        if: ${{ matrix.apt }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.apt }}

      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}

      - name: Testes
        run: |
          for kv in ${{ matrix.env }}; do export "$kv"; done
          ${{ matrix.run }}

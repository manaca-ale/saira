name: Deploy Automatico Saira

on:
  push:
    branches:
      - main      # Producao
      - develop   # Teste

jobs:
  # --- AMBIENTE DE TESTE ---
  deploy-test:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Teste
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "--- INICIANDO DEPLOY DE TESTE (SAIRA) ---"

            cd /home/ubuntu/saira
            git fetch origin develop
            git reset --hard origin/develop

            # Guard pós-reset: cron scripts são versionados 100755, mas reforça o +x
            # como rede de segurança (incidente 2026-06-05: o reset zerou o +x e a
            # recalibração semanal do BGSUB quebrou silenciosamente).
            chmod +x services/yolo-worker-vm/scripts/*.sh 2>/dev/null || true

            cd services

            echo "Reiniciando Ambiente de Teste..."
            # Pre-create shared network so yolo-worker can reach esp32-server by hostname.
            # (saira-esp32-test compose creates this network, but starts after saira-test.)
            docker network create saira-esp32-test_saira_test_net 2>/dev/null || true
            docker compose -p saira-test --profile worker -f docker-compose.test.yml down
            docker compose -p saira-test --profile worker -f docker-compose.test.yml up -d --build --force-recreate

            echo "Subindo ESP32 HTTP Receiver (Teste)..."
            cd /home/ubuntu/saira/esp32-server
            # Bootstrap env file on the server if it doesn't exist yet
            if [ ! -f .env ]; then
              echo "Criando /home/ubuntu/saira/esp32-server/.env com valores padrao..."
              cat > .env << 'EOF'
            # Auto-generated by GitHub Actions on first deploy.
            PUBLIC_BASE_URL=
            UPLOAD_DIR=/app/uploads
            OTA_DIR=/app/ota
            CONFIG_DIR=/app/config
            ADMIN_TOKEN=
            EOF
            fi
            mkdir -p uploads ota config
            docker compose -p saira-esp32-test -f docker-compose.test.yml down --remove-orphans
            docker rm -f saira-esp32-test-esp32-receiver-1 2>/dev/null || true
            # Force-release port 5002 in case a container from a different project still holds it
            docker ps -q --filter "publish=5002" | xargs -r docker stop 2>/dev/null || true
            docker ps -aq --filter "publish=5002" | xargs -r docker rm -f 2>/dev/null || true
            docker compose -p saira-esp32-test -f docker-compose.test.yml up -d --build --force-recreate

            echo "Teste rodando (Projeto: saira-test)"

  # --- AMBIENTE DE PRODUCAO ---
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Producao
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "--- INICIANDO DEPLOY DE PRODUCAO (SAIRA) ---"

            cd /home/ubuntu/saira
            git fetch origin main
            git reset --hard origin/main

            # Guard pós-reset: cron scripts são versionados 100755, mas reforça o +x
            # como rede de segurança (incidente 2026-06-05: o reset zerou o +x e a
            # recalibração semanal do BGSUB quebrou silenciosamente).
            chmod +x services/yolo-worker-vm/scripts/*.sh 2>/dev/null || true

            cd services

            echo "Atualizando Producao..."

            # Stop legacy standalone ESP32 prod containers (now integrated in main compose)
            cd /home/ubuntu/saira/esp32-server
            docker compose -p saira-esp32-prod -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

            cd /home/ubuntu/saira/services

            # Use --build + --force-recreate to ensure new images/build-args are applied.
            # ESP32 server is included in this compose (port 5003) — no standalone needed.
            # --profile worker ensures the yolo-worker service (gated by profile in compose)
            # is also built and recreated, otherwise it keeps a stale image across deploys.
            # STEP: Clean ghost containers from previous --force-recreate runs.
            # Pattern is <12hex>_saira-<svc>-prod (compose renames displaced containers).
            # See: feedback_saira_prod_redeploy_checklist.md
            echo "Limpando ghost containers de deploys anteriores..."
            docker ps -a --format '{{.Names}}' \
              | grep -E '^[0-9a-f]{12}_saira-(web|backend|gateway|esp32-server|db|redis|yolo-worker)-prod$' \
              | xargs -r docker rm -f 2>/dev/null || true

            docker compose -p saira-prod --profile worker -f docker-compose.prod.yml up -d --build --force-recreate

            # STEP: Restart worker so its asyncpg pool reconnects to the (possibly new) DB.
            # Without this, worker emits heartbeats but processes zero images.
            echo "Restartando worker para refrescar conexao DB..."
            docker restart saira-yolo-worker-prod 2>/dev/null || true

            # STEP: Verify nothing got stuck in Created/Exited state.
            echo "Verificando estado pos-deploy..."
            sleep 8
            BROKEN=$(docker ps -a --format '{{.Names}}\t{{.Status}}' \
              | grep -E '^saira-(web|backend|gateway|esp32-server|db|redis|yolo-worker)-prod' \
              | grep -vE 'Up' || true)
            if [ -n "$BROKEN" ]; then
              echo "ERROR: containers nao estao Up apos deploy:"
              echo "$BROKEN"
              exit 1
            fi

            echo "Producao rodando (Projeto: saira-prod)"

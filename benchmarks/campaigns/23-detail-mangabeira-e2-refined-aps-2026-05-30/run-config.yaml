campaign: 23
title: MANGABEIRA E2 — APs refinados (per-person, gatilho temporal)
type: prompt-tuning
date: 2026-05-30
hypothesis: |
  Camp 22 mostrou MANGABEIRA_E perde 2 TPs (FN_NEW: d59d5309, 3c840ac4) e
  introduz 1 FP (5520e0c7) por APs sobre-aplicados (AP2/AP3) ou
  sub-aplicados (AP4). Refinar AP2/AP3 pra avaliação per-pessoa, adicionar
  AP4b (>30s agachada sem objeto novo) e PASSO 2 obrigatório de classificação
  por-pessoa deveria recuperar esses 3 erros sem regressões.


<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOLOv8 Detecção de Objetos</title>
    <style>
      /* Estilos CSS para uma interface limpa e moderna */
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }

      header {
        background-color: #2c3e50;
        color: white;
        padding: 1rem 0;
        width: 100%;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .container {
        background: white;
        padding: 2rem;
        margin-top: 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 90%;
        max-width: 800px;
        text-align: center;
      }

      .controls-group {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.3s;
        text-decoration: none;
        color: white;
        display: inline-block;
      }

      .btn-upload {
        background-color: #3498db;
      }
      .btn-upload:hover {
        background-color: #2980b9;
      }

      .btn-camera {
        background-color: #27ae60;
      }
      .btn-camera:hover {
        background-color: #219150;
      }

      .btn-stop {
        background-color: #e74c3c;
      }
      .btn-stop:hover {
        background-color: #c0392b;
      }

      input[type="file"] {
        display: none; /* Esconde o input file padrão feio */
      }

      .custom-file-upload {
        border: 1px solid #ccc;
        display: inline-block;
        padding: 10px 12px;
        cursor: pointer;
        border-radius: 5px;
        background-color: #ecf0f1;
        color: #333;
        font-size: 14px;
      }

      .video-container {
        margin-top: 20px;
        position: relative;
        min-height: 300px;
        background-color: #000;
        border-radius: 8px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      .placeholder-text {
        color: #777;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>YOLOv8 - Detecção em Tempo Real</h1>
    </header>

    <div class="container">
      <div class="controls-group">
        <form
          action="/"
          method="post"
          enctype="multipart/form-data"
          style="display: flex; align-items: center; gap: 10px"
        >
          <label for="file-upload" class="custom-file-upload">
            📂 Escolher Vídeo
          </label>
          <input
            id="file-upload"
            name="file"
            type="file"
            accept="video/*"
            onchange="this.form.submit()"
          />
        </form>

        <form action="/" method="post">
          <input type="hidden" name="camera" value="true" />
          <button type="submit" class="btn btn-camera">📷 Usar Webcam</button>
        </form>

        <button onclick="stopStream()" class="btn btn-stop">⏹ Parar</button>
      </div>

      <div class="video-container">
        {% if file_path %}
        <img
          src="{{ url_for('video_feed', file=file_path) }}"
          alt="Transmissão YOLOv8"
        />
        {% else %}
        <div class="placeholder-text">
          <p>Selecione um vídeo ou use a webcam para iniciar.</p>
        </div>
        {% endif %}
      </div>
    </div>

    <script>
      // Função para parar o stream sem recarregar a página imediatamente
      function stopStream() {
        fetch("/stop", { method: "POST" })
          .then((response) => response.text())
          .then((data) => {
            console.log(data);
            // Redireciona para a home para limpar a tela
            window.location.href = "/";
          })
          .catch((error) => console.error("Erro:", error));
      }
    </script>
  </body>
</html>

services:
  # Frontend (React + Vite)
  web:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api/v1
    ports:
      - "3000:80"
    container_name: vite-react-ts-app
    restart: always
    depends_on:
      - backend

  # WhatsApp HTTP API (WAHA)
  waha:
    image: devlikeapro/waha
    container_name: saira-waha
    profiles:
      - waha
    ports:
      - "3002:3000"
    expose:
      - "3000"
    environment:
      - WHATSAPP_DEFAULT_ENGINE=WEBJS
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_DASHBOARD_USERNAME=${WAHA_DASHBOARD_USERNAME:-admin}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-admin123}
    restart: always

  # Redis (pub/sub para notificacoes em tempo real)
  redis:
    image: redis:7-alpine
    container_name: saira-redis
    ports:
      - "6380:6379"  # 6380 evita conflito com outros projetos que usem 6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  # Backend API (FastAPI)
  backend:
    build: ./backend
    container_name: saira-backend-api
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/saira_db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_LOCAL_LOGIN=${ENABLE_LOCAL_LOGIN:-true}
      - ENABLE_CONECTA_LOGIN=${ENABLE_CONECTA_LOGIN:-false}
      - CONECTA_ENV=${CONECTA_ENV:-test}
      - CONECTA_BASE_URL_TEST=${CONECTA_BASE_URL_TEST:-https://loginteste.recife.pe.gov.br}
      - CONECTA_BASE_URL_PROD=${CONECTA_BASE_URL_PROD:-https://login.recife.pe.gov.br}
      - CONECTA_REALM=${CONECTA_REALM:-recife}
      - CONECTA_CLIENT_ID=${CONECTA_CLIENT_ID:-}
      - CONECTA_CLIENT_SECRET=${CONECTA_CLIENT_SECRET:-}
      - CONECTA_REDIRECT_URI=${CONECTA_REDIRECT_URI:-}
      - CONECTA_POST_LOGOUT_REDIRECT_URI=${CONECTA_POST_LOGOUT_REDIRECT_URI:-}
      - CONECTA_SCOPE=${CONECTA_SCOPE:-openid profile email}
      - CONECTA_STATE_TTL_SECONDS=${CONECTA_STATE_TTL_SECONDS:-600}
      - CONECTA_TICKET_TTL_SECONDS=${CONECTA_TICKET_TTL_SECONDS:-120}
      - CONECTA_HTTP_TIMEOUT_SECONDS=${CONECTA_HTTP_TIMEOUT_SECONDS:-15}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-waha}
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_SESSION_NAME=${WAHA_SESSION_NAME:-default}
      - META_API_TOKEN=${META_API_TOKEN:-}
      - META_PHONE_ID=${META_PHONE_ID:-}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:3000}
      - ENABLE_WHATSAPP_TEST_ROUTE=${ENABLE_WHATSAPP_TEST_ROUTE:-false}
      - WHATSAPP_TEST_RATE_LIMIT_PER_MINUTE=${WHATSAPP_TEST_RATE_LIMIT_PER_MINUTE:-5}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - ./backend:/app
    command: ["bash", "/app/start.sh", "--workers", "4"]

  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: saira-postgres-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saira_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # pgAdmin (opcional, para desenvolvimento)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: saira-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@saira.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: always

  # ESP32 image receiver
  esp32-server:
    build:
      context: ../esp32-server
    container_name: saira-esp32-server
    ports:
      - "5002:5000"
    environment:
      - UPLOAD_DIR=/app/uploads
      - PUBLIC_BASE_URL=http://localhost:5002
      - ADMIN_TOKEN=
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=4
    volumes:
      - esp32_uploads:/app/uploads
      - ../esp32-server/config:/app/config
      - ../esp32-server/ota:/app/ota
    restart: always

  # YOLO worker — frame comparison + DB insertion
  # Habilitado via profile: docker compose --profile worker up -d
  # Para desabilitar sem remover o serviço: WORKER_ENABLED=false
  # Para simular sem modelos reais:        MOCK_MODE=true docker compose --profile worker up -d
  yolo-worker:
    build:
      context: ./yolo-worker-vm
    container_name: saira-yolo-worker
    profiles:
      - worker
    environment:
      - UPLOAD_DIR=/app/uploads
      - STATE_DIR=/app/state
      - P1_MODEL_PATH=/app/models/yolov8_2142.pt
      - P2_MODEL_PATH=/app/models/yolov8_PeopleCar_200_n.pt
      - CONF_THRESHOLD=0.25
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/saira_db
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5002}
      - POLL_INTERVAL=10
      - PROCESSED_STRATEGY=${PROCESSED_STRATEGY:-two_folders}
      - WORKER_ENABLED=${WORKER_ENABLED:-true}
      - AI_MODEL_PROVIDER=${AI_MODEL_PROVIDER:-yolo}
      - AI_FALLBACK_PROVIDER=${AI_FALLBACK_PROVIDER:-none}
      - MOCK_MODE=${MOCK_MODE:-false}
      - MOCK_DETECTION_PROB=${MOCK_DETECTION_PROB:-0.5}
      - MOCK_MAX_OBJECTS=${MOCK_MAX_OBJECTS:-5}
      - MOCK_INFRATOR_PROB=${MOCK_INFRATOR_PROB:-0.3}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - REKOGNITION_WASTE_DECISION_MODE=${REKOGNITION_WASTE_DECISION_MODE:-binary}
      - REKOGNITION_WASTE_LABELS=${REKOGNITION_WASTE_LABELS:-Garbage,Trash,Waste,Debris,Litter,Junk,Refuse,Landfill}
      - REKOGNITION_WASTE_MIN_CONFIDENCE=${REKOGNITION_WASTE_MIN_CONFIDENCE:-70}
      - REKOGNITION_WASTE_TYPE_VALUE=${REKOGNITION_WASTE_TYPE_VALUE:-Entulho}
      - REKOGNITION_OFFENDER_MODE=${REKOGNITION_OFFENDER_MODE:-detect_labels}
      - REKOGNITION_OFFENDER_LABELS=${REKOGNITION_OFFENDER_LABELS:-Person,Car,Truck,Bus,Motorcycle,Bicycle}
      - REKOGNITION_OFFENDER_MIN_CONFIDENCE=${REKOGNITION_OFFENDER_MIN_CONFIDENCE:-70}
      - REKOGNITION_MAX_LABELS=${REKOGNITION_MAX_LABELS:-50}
      - REKOGNITION_MAX_RETRIES=${REKOGNITION_MAX_RETRIES:-3}
      - REKOGNITION_TIMEOUT_SECONDS=${REKOGNITION_TIMEOUT_SECONDS:-10}
      - REKOGNITION_MOSAIC_ENABLED=${REKOGNITION_MOSAIC_ENABLED:-true}
      - REKOGNITION_MOSAIC_BATCH_SIZE=${REKOGNITION_MOSAIC_BATCH_SIZE:-4}
      - REKOGNITION_MOSAIC_TIMEOUT_SECONDS=${REKOGNITION_MOSAIC_TIMEOUT_SECONDS:-8}
      - REKOGNITION_MOSAIC_TILE_WIDTH=${REKOGNITION_MOSAIC_TILE_WIDTH:-960}
      - REKOGNITION_MOSAIC_TILE_HEIGHT=${REKOGNITION_MOSAIC_TILE_HEIGHT:-720}
      - REKOGNITION_MOSAIC_MAX_PAYLOAD_BYTES=${REKOGNITION_MOSAIC_MAX_PAYLOAD_BYTES:-5242880}
      - REKOGNITION_MOSAIC_JPEG_QUALITY_START=${REKOGNITION_MOSAIC_JPEG_QUALITY_START:-90}
      - REKOGNITION_MOSAIC_JPEG_QUALITY_MIN=${REKOGNITION_MOSAIC_JPEG_QUALITY_MIN:-45}
      - REKOGNITION_MOSAIC_MIN_DOWNSCALE_FACTOR=${REKOGNITION_MOSAIC_MIN_DOWNSCALE_FACTOR:-0.5}
      - REKOGNITION_MOSAIC_PARTIAL_MODE=${REKOGNITION_MOSAIC_PARTIAL_MODE:-pad}
      - GDRIVE_ENABLED=${GDRIVE_ENABLED:-false}
      - GDRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID:-}
      - GDRIVE_SA_KEY_PATH=${GDRIVE_SA_KEY_PATH:-/app/gdrive-sa-key.json}
      - GDRIVE_SYNC_HOUR=${GDRIVE_SYNC_HOUR:-3}
    volumes:
      - esp32_uploads:/app/uploads
      - yolo_state:/app/state
      - ./yolo-worker-vm/models:/app/models
      - ./yolo-worker-vm/src:/app/src   # live code reload (dev)
      # To enable Drive sync: place your service account key on the host and uncomment:
      # - /path/to/gdrive-sa-key.json:/app/gdrive-sa-key.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      esp32-server:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  esp32_uploads:
  yolo_state:

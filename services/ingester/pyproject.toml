[tool.poetry]
name = "ingester"
version = "0.2.0"
description = "Saira Ingester Service - RTSP capture to AWS S3/SQS"
authors = ["Your Name <you@example.com>"]
packages = [{include = "ingester", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pillow = "^10.4.0"
python-dotenv = "^1.0.0"
pyyaml = "^6.0"
opencv-python-headless = "^4.9.0"
boto3 = "^1.34.0"
tenacity = "^8.2.0"
pydantic = "^2.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

services:
  # Frontend (React + Vite)
  web:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api/v1
    ports:
      - "3000:80"
    container_name: saira-web-prod
    environment:
      - TZ=America/Sao_Paulo
      - S3_BUCKET_HOST=${S3_BUCKET_NAME:-saira-images}.s3.${S3_REGION:-sa-east-1}.amazonaws.com
    restart: always
    depends_on:
      - backend

  # Api-Gateway (Nginx)
  api-gateway:
    image: nginx:alpine
    container_name: saira-gateway-prod
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "5000:80"
    depends_on:
      - backend
    restart: always

  # Backend API (FastAPI)
  backend:
    build: ./backend
    container_name: saira-backend-prod
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/saira_db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CAMERA_UPLOADS_DIR=${CAMERA_UPLOADS_DIR:-/app/uploads}
      - CAMERA_UPLOAD_PUBLIC_BASE_URL=${CAMERA_UPLOAD_PUBLIC_BASE_URL:-}
      # Vídeo sob demanda (dispositivos event-driven / Pi relay). Sem isto o
      # backend cai no default vazio de detections.py e o POST /request-video
      # devolve 503 — o botão "Solicitar vídeo" morre em produção. Estava só no
      # yolo-worker (que não atende o endpoint) e no backend do compose de TESTE,
      # que é por onde a feature passou.
      - ESP32_SERVER_URL=${ESP32_SERVER_URL:-http://esp32-server:5000}
      - VIDEO_REQUEST_TIMEOUT_S=${VIDEO_REQUEST_TIMEOUT_S:-600}
      - ENABLE_LOCAL_LOGIN=${ENABLE_LOCAL_LOGIN:-true}
      - ENABLE_CONECTA_LOGIN=${ENABLE_CONECTA_LOGIN:-false}
      - CONECTA_ENV=${CONECTA_ENV:-prod}
      - CONECTA_BASE_URL_TEST=${CONECTA_BASE_URL_TEST:-https://loginteste.recife.pe.gov.br}
      - CONECTA_BASE_URL_PROD=${CONECTA_BASE_URL_PROD:-https://login.recife.pe.gov.br}
      - CONECTA_REALM=${CONECTA_REALM:-recife}
      - CONECTA_CLIENT_ID=${CONECTA_CLIENT_ID:-}
      - CONECTA_CLIENT_SECRET=${CONECTA_CLIENT_SECRET:-}
      - CONECTA_REDIRECT_URI=${CONECTA_REDIRECT_URI:-}
      - CONECTA_POST_LOGOUT_REDIRECT_URI=${CONECTA_POST_LOGOUT_REDIRECT_URI:-}
      - CONECTA_SCOPE=${CONECTA_SCOPE:-openid profile email}
      - CONECTA_STATE_TTL_SECONDS=${CONECTA_STATE_TTL_SECONDS:-600}
      - CONECTA_TICKET_TTL_SECONDS=${CONECTA_TICKET_TTL_SECONDS:-120}
      - CONECTA_HTTP_TIMEOUT_SECONDS=${CONECTA_HTTP_TIMEOUT_SECONDS:-15}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:3000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-sa-east-1}
      - EXPORT_MAX_DAYS=${EXPORT_MAX_DAYS:-7}
      - EXPORT_PRESIGNED_TTL_SECONDS=${EXPORT_PRESIGNED_TTL_SECONDS:-86400}
      - EXPORT_S3_PREFIX=${EXPORT_S3_PREFIX:-exports}
      - EXPORT_UPLOADS_DIR=/app/uploads
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - WORKER_STATE_DIR=/app/yolo_state
      - REPORT_UPLOADS_DIR=/app/uploads
      - REPORTS_OUTPUT_DIR=/app/reports
      - REPORT_DASHBOARD_URL=${REPORT_DASHBOARD_URL:-https://saira.manaca.tech}
      - REPORT_SNAPSHOT_ENABLED=${REPORT_SNAPSHOT_ENABLED:-true}
      - REPORT_SNAPSHOT_HOUR_BRT=${REPORT_SNAPSHOT_HOUR_BRT:-3}
      - REPORT_DEFAULT_CAPTURE_INTERVAL_S=${REPORT_DEFAULT_CAPTURE_INTERVAL_S:-30}
      - KPI_I1_TARGET=${KPI_I1_TARGET:-90.0}
      - KPI_I2_P95_TARGET_S=${KPI_I2_P95_TARGET_S:-60.0}
      - KPI_I3_TARGET=${KPI_I3_TARGET:-80.0}
      - KPI_I4_TARGET=${KPI_I4_TARGET:-80.0}
      - KPI_I5_TARGET=${KPI_I5_TARGET:-100.0}
      - TZ=America/Sao_Paulo
      # Daily Gemini billing report (email via Resend)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-saira@pagamentos.manaca.tech}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-SAIRA Billing}
      - BILLING_REPORT_RECIPIENTS=${BILLING_REPORT_RECIPIENTS:-alecoleto@gmail.com,contato@manaca.tech}
      - BILLING_REPORT_ENABLED=${BILLING_REPORT_ENABLED:-true}
      - BILLING_REPORT_HOUR_BRT=${BILLING_REPORT_HOUR_BRT:-7}
      - BILLING_REPORT_MINUTE_BRT=${BILLING_REPORT_MINUTE_BRT:-0}
      - GEMINI_INPUT_TOKEN_PRICE_PER_1M=${GEMINI_INPUT_TOKEN_PRICE_PER_1M:-0.15}
      - GEMINI_OUTPUT_TOKEN_PRICE_PER_1M=${GEMINI_OUTPUT_TOKEN_PRICE_PER_1M:-0.60}
      # Camera offline alert (email via Resend) — incident 2026-06-09
      - CAMERA_OFFLINE_MONITOR_ENABLED=${CAMERA_OFFLINE_MONITOR_ENABLED:-true}
      - CAMERA_OFFLINE_THRESHOLD_SECONDS=${CAMERA_OFFLINE_THRESHOLD_SECONDS:-3600}
      - CAMERA_OFFLINE_CHECK_INTERVAL_MINUTES=${CAMERA_OFFLINE_CHECK_INTERVAL_MINUTES:-10}
      - CAMERA_OFFLINE_REALERT_SECONDS=${CAMERA_OFFLINE_REALERT_SECONDS:-21600}
      - OFFLINE_ALERT_RECIPIENTS=${OFFLINE_ALERT_RECIPIENTS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - esp32_uploads_prod:/app/uploads:ro
      - yolo_state_prod:/app/yolo_state:ro
      - reports_data_prod:/app/reports
    command: ["bash", "/app/start.sh", "--workers", "4"]

  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: saira-db-prod
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saira_db
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Redis (pub/sub para notificações em tempo real)
  redis:
    image: redis:7-alpine
    container_name: saira-redis-prod
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ESP32 image receiver
  esp32-server:
    build:
      context: ../esp32-server
    container_name: saira-esp32-server-prod
    ports:
      - "5005:5000"
    environment:
      - UPLOAD_DIR=/app/uploads
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5005}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=4
      - TZ=America/Sao_Paulo
      # Devices mounted upside-down: frames are rotated 180° at ingest.
      - ROTATE_180_DEVICES=${ROTATE_180_DEVICES:-}
      # Fila de comandos compartilhada entre os workers gunicorn. Sem isto cada
      # worker tem a sua fila em memória e o comando pode cair no worker que não
      # atende o long-poll do dispositivo. Ausente/fora do ar => cai em memória.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - COMMAND_QUEUE_DEPTH=${COMMAND_QUEUE_DEPTH:-16}
      # Teto do clipe de vídeo (mp4) que a Pi sobe sob CMD_VIDEO_CLIP. 300 MB
      # cobre cadeias longas de clip-chain 1080p (o default de 200 MB rejeitava
      # com 413 clipes de ~233 MB). Ver server.py MAX_VIDEO_BYTES.
      - MAX_VIDEO_BYTES=${MAX_VIDEO_BYTES:-314572800}
    depends_on:
      - redis
    volumes:
      - esp32_uploads_prod:/app/uploads
      - ../esp32-server/config:/app/config
      - ../esp32-server/ota:/app/ota
    restart: always

  # YOLO worker — frame comparison + DB insertion
  # Habilitado via profile: docker compose --profile worker -f docker-compose.prod.yml up -d
  yolo-worker:
    build:
      context: ./yolo-worker-vm
    container_name: saira-yolo-worker-prod
    profiles:
      - worker
    environment:
      - UPLOAD_DIR=/app/uploads
      - STATE_DIR=/app/state
      - P1_MODEL_PATH=/app/models/yolov8_2142.pt
      - P2_MODEL_PATH=/app/models/yolov8_PeopleCar_200_n.pt
      - CONF_THRESHOLD=0.25
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/saira_db
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5005}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      - PROCESSED_STRATEGY=${PROCESSED_STRATEGY:-two_folders}
      - EVENT_WINDOW_MIN=${EVENT_WINDOW_MIN:-10}
      - WORKER_ENABLED=${WORKER_ENABLED:-true}
      - MOCK_MODE=${MOCK_MODE:-false}
      - AI_MODE=${AI_MODE:-yolo}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Vertex AI keyless (active in prod since 788ed7e). Activation via server .env.
      - GEMINI_USE_VERTEX=${GEMINI_USE_VERTEX:-false}
      - GCP_PROJECT=${GCP_PROJECT:-}
      - GCP_LOCATION=${GCP_LOCATION:-global}
      # Regional fallback used only on 429/RESOURCE_EXHAUSTED from the primary
      # (global DSQ congestion — incident 2026-07-16). Empty disables it.
      - GCP_LOCATION_FALLBACK=${GCP_LOCATION_FALLBACK:-us-central1}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
      # Prometheus metrics endpoint (scraped by the prod monitoring stack on the
      # saira-prod network as yolo-worker:9108). Explicit so it's not left to defaults.
      - WORKER_METRICS_ENABLED=${WORKER_METRICS_ENABLED:-true}
      - WORKER_METRICS_HOST=0.0.0.0
      - WORKER_METRICS_PORT=9108
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-45}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-2}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.1}
      - GEMINI_MAX_OUTPUT_TOKENS=${GEMINI_MAX_OUTPUT_TOKENS:-2048}
      - GEMINI_CASCADE_ENABLED=${GEMINI_CASCADE_ENABLED:-false}
      - GEMINI_CASCADE_WINDOW_SECONDS=${GEMINI_CASCADE_WINDOW_SECONDS:-120}
      - GEMINI_CASCADE_MAX_FRAMES=${GEMINI_CASCADE_MAX_FRAMES:-12}
      - GEMINI_CASCADE_MIN_FRAMES=${GEMINI_CASCADE_MIN_FRAMES:-6}
      # Resilience guardrails (2026-07-24, incidente 2026-07-23) — worker/config.py.
      - GEMINI_BREAKER_ENABLED=${GEMINI_BREAKER_ENABLED:-true}
      - GEMINI_BREAKER_THRESHOLD=${GEMINI_BREAKER_THRESHOLD:-5}
      - GEMINI_BREAKER_WINDOW_SECONDS=${GEMINI_BREAKER_WINDOW_SECONDS:-60}
      - GEMINI_BREAKER_COOLDOWN_SECONDS=${GEMINI_BREAKER_COOLDOWN_SECONDS:-60}
      - MAX_WINDOWS_PER_DEVICE_PER_CYCLE=${MAX_WINDOWS_PER_DEVICE_PER_CYCLE:-30}
      - MAX_FRAME_AGE_SECONDS=${MAX_FRAME_AGE_SECONDS:-0}
      - GEMINI_AGENT1_MODEL=${GEMINI_AGENT1_MODEL:-gemini-2.5-flash}
      - GEMINI_AGENT1_TIMEOUT_SECONDS=${GEMINI_AGENT1_TIMEOUT_SECONDS:-15}
      - GEMINI_AGENT1_TRIGGER_MIN_CONFIDENCE=${GEMINI_AGENT1_TRIGGER_MIN_CONFIDENCE:-75}
      - GEMINI_AGENT1_MAX_OUTPUT_TOKENS=${GEMINI_AGENT1_MAX_OUTPUT_TOKENS:-4096}
      # Dual gate (full-frame + pile-crop, OR-escalate). Scoped to GATE_PILECROP_DEVICES.
      # Catches small/zoom-dependent dumps the full frame misses (camp 19: esp32_002 92% recall).
      - GEMINI_GATE_PILECROP_ENABLED=${GEMINI_GATE_PILECROP_ENABLED:-false}
      - GATE_PILECROP_DEVICES=${GATE_PILECROP_DEVICES:-esp32_002}
      - GEMINI_GATE_PILECROP_UPSCALE=${GEMINI_GATE_PILECROP_UPSCALE:-2}
      # Detail-side pile-crop augmentation (campaign 24: esp32_002 91.7% recall + 1.6x V1 spec).
      # When ENABLED, appends N hi-res pile-zone crops alongside the standard global frames
      # in the Agent-2 detail call, and selects the MANGABEIRA_E_WITH_PILECROPS prompt per-camera.
      # Default OFF in prod — promote only after a successful test-saira shadow A/B.
      - GEMINI_DETAIL_PILECROP_ENABLED=${GEMINI_DETAIL_PILECROP_ENABLED:-false}
      - DETAIL_PILECROP_DEVICES=${DETAIL_PILECROP_DEVICES:-esp32_002}
      # Camp 40 high-bar flagrante detail prompt (per-device). Empty = MANGABEIRA_E.
      - DETAIL_HIGHBAR_DEVICES=${DETAIL_HIGHBAR_DEVICES:-}
      - GEMINI_DETAIL_PILECROP_UPSCALE=${GEMINI_DETAIL_PILECROP_UPSCALE:-2}
      - GEMINI_DETAIL_PILECROP_N_FRAMES=${GEMINI_DETAIL_PILECROP_N_FRAMES:-12}
      - GEMINI_SEQUENCE_SIZE=${GEMINI_SEQUENCE_SIZE:-5}
      - GEMINI_SEQUENCE_MAX_SPAN_SECONDS=${GEMINI_SEQUENCE_MAX_SPAN_SECONDS:-4}
      - GEMINI_ENABLE_BATCH=${GEMINI_ENABLE_BATCH:-false}
      - GEMINI_DRY_RUN=${GEMINI_DRY_RUN:-false}
      - GEMINI_MAX_PAYLOAD_BYTES=${GEMINI_MAX_PAYLOAD_BYTES:-8000000}
      - GEMINI_INPUT_TOKEN_PRICE_PER_1M=${GEMINI_INPUT_TOKEN_PRICE_PER_1M:-0.10}
      - GEMINI_OUTPUT_TOKEN_PRICE_PER_1M=${GEMINI_OUTPUT_TOKEN_PRICE_PER_1M:-0.40}
      # BGSUB pre-filter (opt-in; suppresses Gemini gate calls for empty windows)
      - BGSUB_PREFILTER_ENABLED=${BGSUB_PREFILTER_ENABLED:-false}
      - BGSUB_PERSISTENCE_THRESHOLD=${BGSUB_PERSISTENCE_THRESHOLD:-1000}
      - BGSUB_MIN_PX_ACTIVE=${BGSUB_MIN_PX_ACTIVE:-800}
      - BGSUB_MIN_PERSISTENCE_FRAMES=${BGSUB_MIN_PERSISTENCE_FRAMES:-0.6}
      - BGSUB_MOG2_HISTORY=${BGSUB_MOG2_HISTORY:-80}
      - BGSUB_MOG2_VAR_THRESHOLD=${BGSUB_MOG2_VAR_THRESHOLD:-40.0}
      - BGSUB_SHADOW_THRESHOLD=${BGSUB_SHADOW_THRESHOLD:-100}
      # Morphological post-processing mode (open_close=legacy, area_min, off)
      - BGSUB_MORPHO_MODE=${BGSUB_MORPHO_MODE:-open_close}
      - BGSUB_AREA_MIN=${BGSUB_AREA_MIN:-400}
      # Adaptive baseline (Gemini-supervised MOG2 update)
      - BGSUB_ADAPTIVE_ENABLED=${BGSUB_ADAPTIVE_ENABLED:-false}
      - BGSUB_ADAPTIVE_LEARNING_RATE=${BGSUB_ADAPTIVE_LEARNING_RATE:-0.05}
      - BGSUB_ADAPTIVE_MIN_CONFIDENCE=${BGSUB_ADAPTIVE_MIN_CONFIDENCE:-90}
      - BGSUB_ADAPTIVE_SAVE_EVERY_N=${BGSUB_ADAPTIVE_SAVE_EVERY_N:-50}
      - BGSUB_ADAPTIVE_DISABLE_DEVICES=${BGSUB_ADAPTIVE_DISABLE_DEVICES:-}
      # Clean-zone-only adaptive (absorb only when the pile zone is confirmed empty)
      - BGSUB_ADAPTIVE_CLEAN_ZONE_ONLY_DEVICES=${BGSUB_ADAPTIVE_CLEAN_ZONE_ONLY_DEVICES:-}
      # BGSUB shadow (log-only): evaluate + log would-suppress, always pass to the gate
      - BGSUB_SHADOW_DEVICES=${BGSUB_SHADOW_DEVICES:-}
      # Weekly recalibration mixes night frames for these frozen-baseline devices
      # so the baseline isn't day-biased (esp32_005 Arruda). Read by the cron via
      # `docker exec ... python -m worker.recalibrate_bgsub`.
      - BGSUB_RECAL_MIX_NIGHT_DEVICES=${BGSUB_RECAL_MIX_NIGHT_DEVICES:-esp32_005}
      # DINOv2 post-detail FP filter (off|shadow|enforce); rejection-only, per-device
      - DINOV2_FILTER_MODE=${DINOV2_FILTER_MODE:-off}
      - DINOV2_FILTER_DEVICES=${DINOV2_FILTER_DEVICES:-esp32_001}
      - DINOV2_VARIANT=${DINOV2_VARIANT:-dinov2_vits14}
      - DINOV2_THRESHOLD=${DINOV2_THRESHOLD:-}
      - DINOV2_N_FRAMES=${DINOV2_N_FRAMES:-3}
      - DINOV2_INPUT_SIZE=${DINOV2_INPUT_SIZE:-224}
      - DINOV2_TORCH_THREADS=${DINOV2_TORCH_THREADS:-2}
      - DINOV2_RETRAIN_DEVICES=${DINOV2_RETRAIN_DEVICES:-esp32_001}
      - DINOV2_RETRAIN_MIN_AUC=${DINOV2_RETRAIN_MIN_AUC:-0.85}
      # Structural-delta post-detail FP filter (Camp 41); off|shadow|enforce, per-device
      - STRUCTURAL_FILTER_MODE=${STRUCTURAL_FILTER_MODE:-off}
      - STRUCTURAL_DEVICES=${STRUCTURAL_DEVICES:-esp32_002}
      - STRUCTURAL_NTILES_THR=${STRUCTURAL_NTILES_THR:-2}
      # Structural-delta RECOVERY of gate-rejected windows (2026-07-02); off|shadow|enforce
      - STRUCTURAL_RECOVERY_MODE=${STRUCTURAL_RECOVERY_MODE:-off}
      - STRUCTURAL_RECOVERY_DEVICES=${STRUCTURAL_RECOVERY_DEVICES:-esp32_002}
      - STRUCTURAL_RECOVERY_NTILES_THR=${STRUCTURAL_RECOVERY_NTILES_THR:-8}
      # Detail Agent prompt override (audit research, blank = use GEMINI_PROMPT_VERSION)
      - GEMINI_DETAIL_PROMPT_VERSION=${GEMINI_DETAIL_PROMPT_VERSION:-}
      # Car-stopped shadow detector (parallel to Gemini, audit only)
      - CAR_SHADOW_ENABLED=${CAR_SHADOW_ENABLED:-false}
      - CAR_MODEL_PATH=${CAR_MODEL_PATH:-/app/models/yolov8_Car_tesi_100_n.pt}
      - CAR_CONF_THRESHOLD=${CAR_CONF_THRESHOLD:-0.35}
      - CAR_STATIONARY_PIXELS=${CAR_STATIONARY_PIXELS:-50.0}
      - CAR_LOW_FRAMES=${CAR_LOW_FRAMES:-3}
      - CAR_MED_FRAMES=${CAR_MED_FRAMES:-6}
      - CAR_HIGH_FRAMES=${CAR_HIGH_FRAMES:-12}
      - CAR_TRACK_TTL_SECONDS=${CAR_TRACK_TTL_SECONDS:-300}
      - TZ=America/Sao_Paulo
      - GDRIVE_ENABLED=${GDRIVE_ENABLED:-false}
      - GDRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID:-15GxmM3W8fA3xrteLaSw4h3JRtRx-HnQP}
      - GDRIVE_SA_KEY_PATH=${GDRIVE_SA_KEY_PATH:-/app/gdrive-sa-key.json}
      - GDRIVE_SYNC_HOUR=${GDRIVE_SYNC_HOUR:-3}
      - S3_ENABLED=${S3_ENABLED:-true}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-saira-images}
      - S3_REGION=${S3_REGION:-sa-east-1}
      - S3_SYNC_HOUR=${S3_SYNC_HOUR:-3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - ESP32_SERVER_URL=${ESP32_SERVER_URL:-http://esp32-server:5000}
      # Event-driven devices (Pi relay): process motion-event manifests
      # immediately instead of fixed 120s windows; heartbeats GC'd w/o Gemini.
      # Ausente aqui até 14/07/2026: no cutover da pi-cam-001 para prod (24/06) a
      # var ficou só no compose de teste, então o worker de prod caía no caminho
      # legado (main.py: `device_id in config.EVENT_DRIVEN_DEVICES`) e os
      # manifests de evento nunca eram lidos — a Pi rendia ZERO detecções em prod
      # enquanto funcionava em test. Manter em sincronia com docker-compose.test.yml.
      - EVENT_DRIVEN_DEVICES=${EVENT_DRIVEN_DEVICES:-pi-cam-001}
      # Shadow de modelo Gemini-3.1 (Camp 47, log-only). Default OFF; billing isolado
      # no projeto Vertex dedicado SHADOW_GCP_PROJECT (usa a mesma cred WIF de prod).
      - SHADOW_MODEL_ENABLED=${SHADOW_MODEL_ENABLED:-false}
      - SHADOW_MODEL_DEVICES=${SHADOW_MODEL_DEVICES:-}
      - SHADOW_MODEL_GATE=${SHADOW_MODEL_GATE:-gemini-3.1-flash-lite}
      - SHADOW_MODEL_DETAIL=${SHADOW_MODEL_DETAIL:-gemini-3.1-flash-lite}
      - SHADOW_MODEL_MEDIA_RES=${SHADOW_MODEL_MEDIA_RES:-low}
      - SHADOW_MODEL_THINKING=${SHADOW_MODEL_THINKING:-high}
      - SHADOW_MODEL_PROMPT=${SHADOW_MODEL_PROMPT:-g3}
      - SHADOW_MODEL_MAX_OUTPUT_TOKENS=${SHADOW_MODEL_MAX_OUTPUT_TOKENS:-8192}
      - SHADOW_GEMINI_API_KEY=${SHADOW_GEMINI_API_KEY:-}
      - SHADOW_GCP_PROJECT=${SHADOW_GCP_PROJECT:-}
      - SHADOW_GCP_LOCATION=${SHADOW_GCP_LOCATION:-global}
      # Shadow Bedrock (Camp 49, log-only): kimi-k2.5 em chamada única. Default OFF.
      # Billing na conta AWS codex-ops (AWS_ACCESS_KEY_ID acima), NÃO na GCP.
      # Manter em sincronia com docker-compose.test.yml.
      - SHADOW_BEDROCK_ENABLED=${SHADOW_BEDROCK_ENABLED:-false}
      - SHADOW_BEDROCK_DEVICES=${SHADOW_BEDROCK_DEVICES:-}
      - SHADOW_BEDROCK_ALIAS=${SHADOW_BEDROCK_ALIAS:-kimi-k2.5}
      - SHADOW_BEDROCK_REGION=${SHADOW_BEDROCK_REGION:-us-east-1}
      - SHADOW_BEDROCK_IMG_WIDTH=${SHADOW_BEDROCK_IMG_WIDTH:-640}
      - SHADOW_BEDROCK_IMG_QUALITY=${SHADOW_BEDROCK_IMG_QUALITY:-70}
      - SHADOW_BEDROCK_MAX_OUTPUT_TOKENS=${SHADOW_BEDROCK_MAX_OUTPUT_TOKENS:-8192}
      - SHADOW_BEDROCK_TIMEOUT_TRIES=${SHADOW_BEDROCK_TIMEOUT_TRIES:-2}
      - SHADOW_BEDROCK_BACKOFF_CAP_S=${SHADOW_BEDROCK_BACKOFF_CAP_S:-8}
      - SHADOW_BEDROCK_DEADLINE_S=${SHADOW_BEDROCK_DEADLINE_S:-60}
      - SHADOW_BEDROCK_BREAKER_FAILS=${SHADOW_BEDROCK_BREAKER_FAILS:-5}
      - SHADOW_BEDROCK_BREAKER_COOLDOWN_S=${SHADOW_BEDROCK_BREAKER_COOLDOWN_S:-900}
      # SHADOW Camp 51 Fase B: dois gates candidatos + kimi no detail, log-only.
      # Mede a taxa de passagem ABSOLUTA em tráfego real (o que falta para dimensionar
      # o custo da migração de out/2026). Manter em sincronia com docker-compose.test.yml.
      - SHADOW_C51_ENABLED=${SHADOW_C51_ENABLED:-false}
      - SHADOW_C51_DEVICES=${SHADOW_C51_DEVICES:-}
      - SHADOW_C51_GATE_A=${SHADOW_C51_GATE_A:-gemini-3.1-flash-lite}
      - SHADOW_C51_GATE_B=${SHADOW_C51_GATE_B:-magistral-small}
      - SHADOW_C51_GATE_PROMPT=${SHADOW_C51_GATE_PROMPT:-g3}
      - SHADOW_C51_DETAIL_ALIAS=${SHADOW_C51_DETAIL_ALIAS:-kimi-k2.5}
      - SHADOW_C51_GATE_MIDS=${SHADOW_C51_GATE_MIDS:-3}
      - SHADOW_C51_TRIGGER_THR=${SHADOW_C51_TRIGGER_THR:-85}
      - SHADOW_C51_DAILY_BUDGET_USD=${SHADOW_C51_DAILY_BUDGET_USD:-3.50}
    volumes:
      - esp32_uploads_prod:/app/uploads
      - yolo_state_prod:/app/state
      - ./yolo-worker-vm/models:/app/models
      # Keyless Vertex WIF cred-config (server artifact). Only read when GEMINI_USE_VERTEX=true.
      - ./yolo-worker-vm/vertex-cred-config.json:/app/vertex-cred-config.json:ro
      # To enable Drive sync: place your service account key on the server and uncomment:
      # - /home/ubuntu/saira/gdrive-sa-key.json:/app/gdrive-sa-key.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      esp32-server:
        condition: service_started
    restart: on-failure

  # ── Prod monitoring stack (added 2026-06-09) ──────────────────────────────
  # Until now only the TEST worker was scraped; prod ran blind. Scrapes the prod
  # worker on the saira-prod network and alerts to e-mail via Resend (Alertmanager).
  # NOTE: bringing this up recreates the worker (WORKER_METRICS env) — coordinate.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: saira-prometheus-prod
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data_prod:/prometheus
    ports:
      - "127.0.0.1:9092:9090"   # acesso via SSH tunnel; não exposto publicamente
    depends_on:
      # yolo-worker is gated behind --profile worker; required: false keeps the
      # start ordering when the profile is active and skips the dependency when
      # it is not — otherwise any compose command without the profile fails with
      # 'service "prometheus" depends on undefined service "yolo-worker"'.
      yolo-worker:
        condition: service_started
        required: false
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: saira-alertmanager-prod
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.prod.yml:/etc/alertmanager/alertmanager.yml:ro
      # Diretório de segredos: coloque o arquivo `resend_api_key` (= RESEND_API_KEY) aqui no servidor.
      - ./observability/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data_prod:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    restart: always

  grafana:
    image: grafana/grafana:11.3.1
    container_name: saira-grafana-prod
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      - prometheus
    restart: always

volumes:
  postgres_data_prod:
  redis_data_prod:
  esp32_uploads_prod:
  yolo_state_prod:
  reports_data_prod:
  prometheus_data_prod:
  grafana_data_prod:
  alertmanager_data_prod:

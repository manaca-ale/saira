services:
  # Frontend (React + Vite)
  web:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api/v1
    ports:
      - "3000:80"
    container_name: saira-web-prod
    environment:
      - TZ=America/Sao_Paulo
      - S3_BUCKET_HOST=${S3_BUCKET_NAME:-saira-images}.s3.${S3_REGION:-sa-east-1}.amazonaws.com
    restart: always
    depends_on:
      - backend

  # Api-Gateway (Nginx)
  api-gateway:
    image: nginx:alpine
    container_name: saira-gateway-prod
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "5000:80"
    depends_on:
      - backend
    restart: always

  # Backend API (FastAPI)
  backend:
    build: ./backend
    container_name: saira-backend-prod
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/saira_db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CAMERA_UPLOADS_DIR=${CAMERA_UPLOADS_DIR:-/app/uploads}
      - CAMERA_UPLOAD_PUBLIC_BASE_URL=${CAMERA_UPLOAD_PUBLIC_BASE_URL:-}
      - ENABLE_LOCAL_LOGIN=${ENABLE_LOCAL_LOGIN:-true}
      - ENABLE_CONECTA_LOGIN=${ENABLE_CONECTA_LOGIN:-false}
      - CONECTA_ENV=${CONECTA_ENV:-prod}
      - CONECTA_BASE_URL_TEST=${CONECTA_BASE_URL_TEST:-https://loginteste.recife.pe.gov.br}
      - CONECTA_BASE_URL_PROD=${CONECTA_BASE_URL_PROD:-https://login.recife.pe.gov.br}
      - CONECTA_REALM=${CONECTA_REALM:-recife}
      - CONECTA_CLIENT_ID=${CONECTA_CLIENT_ID:-}
      - CONECTA_CLIENT_SECRET=${CONECTA_CLIENT_SECRET:-}
      - CONECTA_REDIRECT_URI=${CONECTA_REDIRECT_URI:-}
      - CONECTA_POST_LOGOUT_REDIRECT_URI=${CONECTA_POST_LOGOUT_REDIRECT_URI:-}
      - CONECTA_SCOPE=${CONECTA_SCOPE:-openid profile email}
      - CONECTA_STATE_TTL_SECONDS=${CONECTA_STATE_TTL_SECONDS:-600}
      - CONECTA_TICKET_TTL_SECONDS=${CONECTA_TICKET_TTL_SECONDS:-120}
      - CONECTA_HTTP_TIMEOUT_SECONDS=${CONECTA_HTTP_TIMEOUT_SECONDS:-15}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:3000}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-sa-east-1}
      - EXPORT_MAX_DAYS=${EXPORT_MAX_DAYS:-7}
      - EXPORT_PRESIGNED_TTL_SECONDS=${EXPORT_PRESIGNED_TTL_SECONDS:-86400}
      - EXPORT_S3_PREFIX=${EXPORT_S3_PREFIX:-exports}
      - EXPORT_UPLOADS_DIR=/app/uploads
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - WORKER_STATE_DIR=/app/yolo_state
      - REPORT_UPLOADS_DIR=/app/uploads
      - REPORTS_OUTPUT_DIR=/app/reports
      - REPORT_DASHBOARD_URL=${REPORT_DASHBOARD_URL:-https://saira.manaca.tech}
      - REPORT_SNAPSHOT_ENABLED=${REPORT_SNAPSHOT_ENABLED:-true}
      - REPORT_SNAPSHOT_HOUR_BRT=${REPORT_SNAPSHOT_HOUR_BRT:-3}
      - REPORT_DEFAULT_CAPTURE_INTERVAL_S=${REPORT_DEFAULT_CAPTURE_INTERVAL_S:-30}
      - KPI_I1_TARGET=${KPI_I1_TARGET:-90.0}
      - KPI_I2_P95_TARGET_S=${KPI_I2_P95_TARGET_S:-60.0}
      - KPI_I3_TARGET=${KPI_I3_TARGET:-80.0}
      - KPI_I4_TARGET=${KPI_I4_TARGET:-80.0}
      - KPI_I5_TARGET=${KPI_I5_TARGET:-100.0}
      - TZ=America/Sao_Paulo
      # Daily Gemini billing report (email via Resend)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-saira@pagamentos.manaca.tech}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-SAIRA Billing}
      - BILLING_REPORT_RECIPIENTS=${BILLING_REPORT_RECIPIENTS:-alecoleto@gmail.com,contato@manaca.tech}
      - BILLING_REPORT_ENABLED=${BILLING_REPORT_ENABLED:-true}
      - BILLING_REPORT_HOUR_BRT=${BILLING_REPORT_HOUR_BRT:-7}
      - BILLING_REPORT_MINUTE_BRT=${BILLING_REPORT_MINUTE_BRT:-0}
      - GEMINI_INPUT_TOKEN_PRICE_PER_1M=${GEMINI_INPUT_TOKEN_PRICE_PER_1M:-0.15}
      - GEMINI_OUTPUT_TOKEN_PRICE_PER_1M=${GEMINI_OUTPUT_TOKEN_PRICE_PER_1M:-0.60}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - esp32_uploads_prod:/app/uploads:ro
      - yolo_state_prod:/app/yolo_state:ro
      - reports_data_prod:/app/reports
    command: ["bash", "/app/start.sh", "--workers", "4"]

  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: saira-db-prod
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saira_db
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Redis (pub/sub para notificações em tempo real)
  redis:
    image: redis:7-alpine
    container_name: saira-redis-prod
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # ESP32 image receiver
  esp32-server:
    build:
      context: ../esp32-server
    container_name: saira-esp32-server-prod
    ports:
      - "5005:5000"
    environment:
      - UPLOAD_DIR=/app/uploads
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5005}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - GUNICORN_WORKERS=2
      - GUNICORN_THREADS=4
      - TZ=America/Sao_Paulo
    volumes:
      - esp32_uploads_prod:/app/uploads
      - ../esp32-server/config:/app/config
      - ../esp32-server/ota:/app/ota
    restart: always

  # YOLO worker — frame comparison + DB insertion
  # Habilitado via profile: docker compose --profile worker -f docker-compose.prod.yml up -d
  yolo-worker:
    build:
      context: ./yolo-worker-vm
    container_name: saira-yolo-worker-prod
    profiles:
      - worker
    environment:
      - UPLOAD_DIR=/app/uploads
      - STATE_DIR=/app/state
      - P1_MODEL_PATH=/app/models/yolov8_2142.pt
      - P2_MODEL_PATH=/app/models/yolov8_PeopleCar_200_n.pt
      - CONF_THRESHOLD=0.25
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/saira_db
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5005}
      - POLL_INTERVAL=${POLL_INTERVAL:-10}
      - PROCESSED_STRATEGY=${PROCESSED_STRATEGY:-two_folders}
      - EVENT_WINDOW_MIN=${EVENT_WINDOW_MIN:-10}
      - WORKER_ENABLED=${WORKER_ENABLED:-true}
      - MOCK_MODE=${MOCK_MODE:-false}
      - AI_MODE=${AI_MODE:-yolo}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-45}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-2}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.1}
      - GEMINI_MAX_OUTPUT_TOKENS=${GEMINI_MAX_OUTPUT_TOKENS:-2048}
      - GEMINI_CASCADE_ENABLED=${GEMINI_CASCADE_ENABLED:-false}
      - GEMINI_CASCADE_WINDOW_SECONDS=${GEMINI_CASCADE_WINDOW_SECONDS:-120}
      - GEMINI_CASCADE_MAX_FRAMES=${GEMINI_CASCADE_MAX_FRAMES:-12}
      - GEMINI_CASCADE_MIN_FRAMES=${GEMINI_CASCADE_MIN_FRAMES:-6}
      - GEMINI_AGENT1_MODEL=${GEMINI_AGENT1_MODEL:-gemini-2.5-flash}
      - GEMINI_AGENT1_TIMEOUT_SECONDS=${GEMINI_AGENT1_TIMEOUT_SECONDS:-15}
      - GEMINI_AGENT1_TRIGGER_MIN_CONFIDENCE=${GEMINI_AGENT1_TRIGGER_MIN_CONFIDENCE:-75}
      - GEMINI_AGENT1_MAX_OUTPUT_TOKENS=${GEMINI_AGENT1_MAX_OUTPUT_TOKENS:-4096}
      - GEMINI_SEQUENCE_SIZE=${GEMINI_SEQUENCE_SIZE:-5}
      - GEMINI_SEQUENCE_MAX_SPAN_SECONDS=${GEMINI_SEQUENCE_MAX_SPAN_SECONDS:-4}
      - GEMINI_ENABLE_BATCH=${GEMINI_ENABLE_BATCH:-false}
      - GEMINI_DRY_RUN=${GEMINI_DRY_RUN:-false}
      - GEMINI_MAX_PAYLOAD_BYTES=${GEMINI_MAX_PAYLOAD_BYTES:-8000000}
      - GEMINI_INPUT_TOKEN_PRICE_PER_1M=${GEMINI_INPUT_TOKEN_PRICE_PER_1M:-0.10}
      - GEMINI_OUTPUT_TOKEN_PRICE_PER_1M=${GEMINI_OUTPUT_TOKEN_PRICE_PER_1M:-0.40}
      # BGSUB pre-filter (opt-in; suppresses Gemini gate calls for empty windows)
      - BGSUB_PREFILTER_ENABLED=${BGSUB_PREFILTER_ENABLED:-false}
      - BGSUB_PERSISTENCE_THRESHOLD=${BGSUB_PERSISTENCE_THRESHOLD:-1000}
      - BGSUB_MIN_PX_ACTIVE=${BGSUB_MIN_PX_ACTIVE:-800}
      - BGSUB_MIN_PERSISTENCE_FRAMES=${BGSUB_MIN_PERSISTENCE_FRAMES:-0.6}
      - BGSUB_MOG2_HISTORY=${BGSUB_MOG2_HISTORY:-80}
      - BGSUB_MOG2_VAR_THRESHOLD=${BGSUB_MOG2_VAR_THRESHOLD:-40.0}
      - BGSUB_SHADOW_THRESHOLD=${BGSUB_SHADOW_THRESHOLD:-100}
      # Morphological post-processing mode (open_close=legacy, area_min, off)
      - BGSUB_MORPHO_MODE=${BGSUB_MORPHO_MODE:-open_close}
      - BGSUB_AREA_MIN=${BGSUB_AREA_MIN:-400}
      # Adaptive baseline (Gemini-supervised MOG2 update)
      - BGSUB_ADAPTIVE_ENABLED=${BGSUB_ADAPTIVE_ENABLED:-false}
      - BGSUB_ADAPTIVE_LEARNING_RATE=${BGSUB_ADAPTIVE_LEARNING_RATE:-0.05}
      - BGSUB_ADAPTIVE_MIN_CONFIDENCE=${BGSUB_ADAPTIVE_MIN_CONFIDENCE:-90}
      - BGSUB_ADAPTIVE_SAVE_EVERY_N=${BGSUB_ADAPTIVE_SAVE_EVERY_N:-50}
      # Detail Agent prompt override (audit research, blank = use GEMINI_PROMPT_VERSION)
      - GEMINI_DETAIL_PROMPT_VERSION=${GEMINI_DETAIL_PROMPT_VERSION:-}
      # Car-stopped shadow detector (parallel to Gemini, audit only)
      - CAR_SHADOW_ENABLED=${CAR_SHADOW_ENABLED:-false}
      - CAR_MODEL_PATH=${CAR_MODEL_PATH:-/app/models/yolov8_Car_tesi_100_n.pt}
      - CAR_CONF_THRESHOLD=${CAR_CONF_THRESHOLD:-0.35}
      - CAR_STATIONARY_PIXELS=${CAR_STATIONARY_PIXELS:-50.0}
      - CAR_LOW_FRAMES=${CAR_LOW_FRAMES:-3}
      - CAR_MED_FRAMES=${CAR_MED_FRAMES:-6}
      - CAR_HIGH_FRAMES=${CAR_HIGH_FRAMES:-12}
      - CAR_TRACK_TTL_SECONDS=${CAR_TRACK_TTL_SECONDS:-300}
      - TZ=America/Sao_Paulo
      - GDRIVE_ENABLED=${GDRIVE_ENABLED:-false}
      - GDRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID:-15GxmM3W8fA3xrteLaSw4h3JRtRx-HnQP}
      - GDRIVE_SA_KEY_PATH=${GDRIVE_SA_KEY_PATH:-/app/gdrive-sa-key.json}
      - GDRIVE_SYNC_HOUR=${GDRIVE_SYNC_HOUR:-3}
      - S3_ENABLED=${S3_ENABLED:-true}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-saira-images}
      - S3_REGION=${S3_REGION:-sa-east-1}
      - S3_SYNC_HOUR=${S3_SYNC_HOUR:-3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - ESP32_SERVER_URL=${ESP32_SERVER_URL:-http://esp32-server:5000}
    volumes:
      - esp32_uploads_prod:/app/uploads
      - yolo_state_prod:/app/state
      - ./yolo-worker-vm/models:/app/models
      # To enable Drive sync: place your service account key on the server and uncomment:
      # - /home/ubuntu/saira/gdrive-sa-key.json:/app/gdrive-sa-key.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      esp32-server:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data_prod:
  redis_data_prod:
  esp32_uploads_prod:
  yolo_state_prod:
  reports_data_prod:

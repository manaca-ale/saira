services:
  # Frontend (React + Vite)
  web:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api/v1
    ports:
      - "3000:80"
    container_name: saira-web-prod
    restart: always
    depends_on:
      - backend

  # Api-Gateway (Nginx)
  api-gateway:
    image: nginx:alpine
    container_name: saira-gateway-prod
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "5000:80"
    depends_on:
      - backend
    restart: always

  # Backend API (FastAPI)
  backend:
    build: ./backend
    container_name: saira-backend-prod
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/saira_db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    restart: always
    command: ["bash", "/app/start.sh", "--workers", "4"]

  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: saira-db-prod
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saira_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data_prod:

services:
  # Frontend (React + Vite)
  web:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api/v1
    ports:
      - "3001:80"
    container_name: saira-web-test
    environment:
      - TZ=America/Sao_Paulo
      - S3_BUCKET_HOST=${S3_BUCKET_NAME:-saira-images}.s3.${S3_REGION:-sa-east-1}.amazonaws.com
    restart: always
    depends_on:
      - backend
    networks:
      - default
      - saira_esp32_test_net

  # Api-Gateway (Nginx)
  api-gateway:
    image: nginx:alpine
    container_name: saira-gateway-test
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "5001:80"
    depends_on:
      - backend
    restart: always

  # Redis (pub/sub para notificações em tempo real)
  redis:
    image: redis:7-alpine
    container_name: saira-redis-test
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - redis_data_test:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always

  # Backend API (FastAPI)
  backend:
    build: ./backend
    container_name: saira-backend-test
    ports:
      - "8002:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/saira_db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production-min-32-chars}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CAMERA_UPLOADS_DIR=${CAMERA_UPLOADS_DIR:-/app/uploads}
      - CAMERA_UPLOAD_PUBLIC_BASE_URL=${CAMERA_UPLOAD_PUBLIC_BASE_URL:-}
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_LOCAL_LOGIN=${ENABLE_LOCAL_LOGIN:-true}
      - ENABLE_CONECTA_LOGIN=${ENABLE_CONECTA_LOGIN:-false}
      - CONECTA_ENV=${CONECTA_ENV:-test}
      - CONECTA_BASE_URL_TEST=${CONECTA_BASE_URL_TEST:-https://loginteste.recife.pe.gov.br}
      - CONECTA_BASE_URL_PROD=${CONECTA_BASE_URL_PROD:-https://login.recife.pe.gov.br}
      - CONECTA_REALM=${CONECTA_REALM:-recife}
      - CONECTA_CLIENT_ID=${CONECTA_CLIENT_ID:-}
      - CONECTA_CLIENT_SECRET=${CONECTA_CLIENT_SECRET:-}
      - CONECTA_REDIRECT_URI=${CONECTA_REDIRECT_URI:-}
      - CONECTA_POST_LOGOUT_REDIRECT_URI=${CONECTA_POST_LOGOUT_REDIRECT_URI:-}
      - CONECTA_SCOPE=${CONECTA_SCOPE:-openid profile email}
      - CONECTA_STATE_TTL_SECONDS=${CONECTA_STATE_TTL_SECONDS:-600}
      - CONECTA_TICKET_TTL_SECONDS=${CONECTA_TICKET_TTL_SECONDS:-120}
      - CONECTA_HTTP_TIMEOUT_SECONDS=${CONECTA_HTTP_TIMEOUT_SECONDS:-15}
      - WEB_APP_URL=${WEB_APP_URL:-http://localhost:3001}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-waha}
      - WAHA_BASE_URL=${WAHA_BASE_URL:-http://waha:3000}
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_SESSION_NAME=${WAHA_SESSION_NAME:-default}
      - ENVIRONMENT=test
      - WORKER_STATE_DIR=/app/yolo_state
      - REPORT_UPLOADS_DIR=/app/uploads
      - REPORTS_OUTPUT_DIR=/app/reports
      - REPORT_DASHBOARD_URL=${REPORT_DASHBOARD_URL:-https://test-saira.manaca.tech}
      - REPORT_SNAPSHOT_ENABLED=${REPORT_SNAPSHOT_ENABLED:-true}
      - REPORT_SNAPSHOT_HOUR_BRT=${REPORT_SNAPSHOT_HOUR_BRT:-3}
      - REPORT_DEFAULT_CAPTURE_INTERVAL_S=${REPORT_DEFAULT_CAPTURE_INTERVAL_S:-30}
      - KPI_I1_TARGET=${KPI_I1_TARGET:-90.0}
      - KPI_I2_P95_TARGET_S=${KPI_I2_P95_TARGET_S:-60.0}
      - KPI_I3_TARGET=${KPI_I3_TARGET:-80.0}
      - KPI_I4_TARGET=${KPI_I4_TARGET:-80.0}
      - KPI_I5_TARGET=${KPI_I5_TARGET:-100.0}
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - ../esp32-server/uploads:/app/uploads:ro
      - yolo_state_test:/app/yolo_state:ro
      - reports_data_test:/app/reports
    command: ["bash", "/app/start.sh", "--workers", "4"]

  # YOLO worker — frame comparison + DB insertion
  yolo-worker:
    build:
      context: ./yolo-worker-vm
    container_name: saira-yolo-worker-test
    environment:
      - UPLOAD_DIR=/app/uploads
      - STATE_DIR=/app/state
      - WORKER_METRICS_ENABLED=${WORKER_METRICS_ENABLED:-true}
      - WORKER_METRICS_HOST=${WORKER_METRICS_HOST:-0.0.0.0}
      - WORKER_METRICS_PORT=${WORKER_METRICS_PORT:-9108}
      - P1_MODEL_PATH=/app/models/yolov8_2142.pt
      - P2_MODEL_PATH=/app/models/yolov8_PeopleCar_200_n.pt
      - CONF_THRESHOLD=0.25
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/saira_db
      - REDIS_URL=redis://redis:6379/0
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5002}
      - POLL_INTERVAL=10
      - PROCESSED_STRATEGY=${PROCESSED_STRATEGY:-two_folders}
      - WORKER_ENABLED=${WORKER_ENABLED:-true}
      - MOCK_MODE=${MOCK_MODE:-false}
      - MOCK_DETECTION_PROB=${MOCK_DETECTION_PROB:-0.5}
      - MOCK_MAX_OBJECTS=${MOCK_MAX_OBJECTS:-5}
      - MOCK_INFRATOR_PROB=${MOCK_INFRATOR_PROB:-0.3}
      - AI_MODE=${AI_MODE:-shadow}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_TIMEOUT_SECONDS=${GEMINI_TIMEOUT_SECONDS:-30}
      - GEMINI_MAX_RETRIES=${GEMINI_MAX_RETRIES:-2}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.1}
      - GEMINI_MAX_OUTPUT_TOKENS=${GEMINI_MAX_OUTPUT_TOKENS:-2048}
      - GEMINI_CASCADE_ENABLED=${GEMINI_CASCADE_ENABLED:-false}
      - GEMINI_CASCADE_WINDOW_SECONDS=${GEMINI_CASCADE_WINDOW_SECONDS:-120}
      - GEMINI_CASCADE_MAX_FRAMES=${GEMINI_CASCADE_MAX_FRAMES:-12}
      - GEMINI_CASCADE_MIN_FRAMES=${GEMINI_CASCADE_MIN_FRAMES:-6}
      - GEMINI_AGENT1_MODEL=${GEMINI_AGENT1_MODEL:-gemini-2.5-flash}
      - GEMINI_AGENT1_TIMEOUT_SECONDS=${GEMINI_AGENT1_TIMEOUT_SECONDS:-15}
      - GEMINI_AGENT1_TRIGGER_MIN_CONFIDENCE=${GEMINI_AGENT1_TRIGGER_MIN_CONFIDENCE:-75}
      - GEMINI_AGENT1_MAX_OUTPUT_TOKENS=${GEMINI_AGENT1_MAX_OUTPUT_TOKENS:-4096}
      - GEMINI_SEQUENCE_SIZE=${GEMINI_SEQUENCE_SIZE:-5}
      - GEMINI_SEQUENCE_MAX_SPAN_SECONDS=${GEMINI_SEQUENCE_MAX_SPAN_SECONDS:-4}
      - GEMINI_ENABLE_BATCH=${GEMINI_ENABLE_BATCH:-false}
      - GEMINI_DRY_RUN=${GEMINI_DRY_RUN:-false}
      - GEMINI_MAX_PAYLOAD_BYTES=${GEMINI_MAX_PAYLOAD_BYTES:-8000000}
      - GEMINI_INPUT_TOKEN_PRICE_PER_1M=${GEMINI_INPUT_TOKEN_PRICE_PER_1M:-0.10}
      - GEMINI_OUTPUT_TOKEN_PRICE_PER_1M=${GEMINI_OUTPUT_TOKEN_PRICE_PER_1M:-0.40}
      - TZ=America/Sao_Paulo
      - GDRIVE_ENABLED=${GDRIVE_ENABLED:-false}
      - GDRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID:-1sds3yeef0o9j902X2taxFoEE0iU42sF4}
      - GDRIVE_SA_KEY_PATH=${GDRIVE_SA_KEY_PATH:-/app/gdrive-sa-key.json}
      - GDRIVE_SYNC_HOUR=${GDRIVE_SYNC_HOUR:-3}
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-saira-images}
      - S3_REGION=${S3_REGION:-sa-east-1}
      - S3_SYNC_HOUR=${S3_SYNC_HOUR:-3}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - ESP32_SERVER_URL=${ESP32_SERVER_URL:-http://esp32-server:5000}
    volumes:
      - ../esp32-server/uploads:/app/uploads
      - yolo_state_test:/app/state
      - ./yolo-worker-vm/models:/app/models
    ports:
      - "9108:9108"
      # To enable Drive sync: place your service account key on the server and uncomment:
      # - /home/ubuntu/saira/gdrive-sa-key.json:/app/gdrive-sa-key.json:ro
    networks:
      - default
      - saira_esp32_test_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  gemini-billing-exporter:
    build:
      context: ./observability/gemini-billing-exporter
    container_name: saira-gemini-billing-exporter-test
    environment:
      - GCP_PROJECTS=[{"id":"gen-lang-client-0028842427","name":"Saira"},{"id":"gen-lang-client-0487533939","name":"Flora"},{"id":"gen-lang-client-0616161525","name":"Teste"},{"id":"manafin","name":"Manafin"}]
      - POLL_INTERVAL=${BILLING_POLL_INTERVAL:-300}
      - EXPORTER_PORT=9109
      - BRL_RATE=${BRL_RATE:-5.7}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-credentials.json
    volumes:
      - ${GCP_ADC_PATH:-~/.config/gcloud/application_default_credentials.json}:/app/gcp-credentials.json:ro
    ports:
      - "9109:9109"
    restart: always

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: saira-prometheus-test
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.test.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_test:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - yolo-worker
    restart: always

  grafana:
    image: grafana/grafana:11.3.1
    container_name: saira-grafana-test
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_test:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3004:3000"
    depends_on:
      - prometheus
    restart: always

  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: saira-db-test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=saira_db
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # pgAdmin (teste)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: saira-pgadmin-test
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@saira.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5051:80"
    depends_on:
      - db
    restart: always

volumes:
  postgres_data_test:
  redis_data_test:
  yolo_state_test:
  prometheus_data_test:
  grafana_data_test:
  reports_data_test:

networks:
  default:
    name: saira-test_default
  saira_esp32_test_net:
    # Shared with the esp32-server compose (saira-esp32-test project)
    # Allows yolo-worker to POST triggers to http://esp32-server:5000/device/<id>/trigger
    external: true
    name: saira-esp32-test_saira_test_net

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: saira-yolo-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["yolo-worker:9108"]

  - job_name: gemini-billing-exporter
    metrics_path: /metrics
    scrape_interval: 300s
    static_configs:
      - targets: ["gemini-billing-exporter:9109"]

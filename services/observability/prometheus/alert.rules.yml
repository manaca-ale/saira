groups:
  # ── Gemini/Vertex gate health (item 2) ────────────────────────────────────
  # The 429 RESOURCE_EXHAUSTED on 2026-06-08/09 killed detection ~18h unnoticed.
  - name: saira-gate
    rules:
      - alert: GeminiGateQuotaOrAuthOutage
        # Any quota (429/RESOURCE_EXHAUSTED/prepayment) or auth (RefreshError/
        # credential/permission) failure on the gate in the last 10min.
        expr: increase(saira_gemini_error_type_total{agent="gate", error_type=~"quota|auth"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Gate Gemini/Vertex falhando ({{ $labels.error_type }})"
          description: >-
            saira_gemini_error_type_total agent=gate error_type={{ $labels.error_type }}
            subiu nos últimos 10min — a detecção pode estar parada. quota=créditos/limite
            (ex.: AI Studio pré-pago zerado → migrar/checar Vertex billing);
            auth=credencial/WIF (checar GEMINI_USE_VERTEX e a cadeia keyless).

      - alert: GeminiGateStalled
        # Worker processou imagens mas o gate não fez NENHUMA chamada em 15min:
        # gate_ok zerado (falha silenciosa de credencial/cliente).
        # `or vector(0)` → série ausente (gate nunca chamou desde o start) conta como 0.
        expr: >-
          ((sum(increase(saira_gemini_calls_total{agent="gate"}[15m])) or vector(0)) == 0)
          and (sum(increase(saira_worker_images_processed_total[15m])) > 0)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Gate Gemini sem chamadas com imagens entrando"
          description: >-
            O worker processou imagens nos últimos 15min mas o gate não fez nenhuma
            chamada — possível falha silenciosa de auth/cliente Gemini.

  # ── Worker liveness / scrape health ───────────────────────────────────────
  - name: saira-worker-health
    rules:
      - alert: WorkerNoScanCycles
        expr: increase(saira_worker_scan_cycles_total[10m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Worker prod sem ciclos de scan há 10min"
          description: "saira_worker_scan_cycles_total não avança — worker travado/morto."

      - alert: WorkerMetricsDown
        expr: up{job="saira-yolo-worker"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Métricas do worker prod inacessíveis (:9108)"
          description: "Prometheus não consegue raspar o worker prod — container fora ou metrics off."
